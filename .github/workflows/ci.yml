name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install ruff==0.4.8
      - run: ruff check src/ experiments/ --output-format=github
      - run: ruff format src/ experiments/ --check

  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install mypy numpy pandas-stubs types-PyYAML torch scikit-learn
      - run: mypy src/ --ignore-missing-imports --no-strict-optional

  security:
    name: Security scan (bandit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install bandit[toml]
      - run: bandit -r src/ -ll --exit-zero -f json -o bandit-report.json
      - run: bandit -r src/ -ll
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: bandit-report-pdu, path: bandit-report.json }

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: test-pdu-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
      - name: Install deps
        run: pip install numpy pandas scikit-learn torch pytest pytest-cov
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short             --cov=src --cov-report=xml --cov-fail-under=25
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-pdu-py${{ matrix.python-version }}
          path: coverage.xml

  smoke:
    name: Smoke experiment (IsolationForest + LSTM)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: smoke-pdu-${{ hashFiles('requirements.txt') }}
      - name: Install deps
        run: pip install numpy pandas scikit-learn torch matplotlib
      - name: Generate PDU data
        run: python src/simulator/pdu_simulator.py --n-steps 120
      - name: Run smoke experiment
        run: python experiments/run_smoke.py --steps 120
      - name: Validate anomaly metrics
        run: |
          python - <<'EOF'
          import csv
          rows = {r["metric"]: float(r["value"])
                  for r in csv.DictReader(open("experiments/results/smoke_metrics.csv"))}
          print(f"Precision={rows['precision']:.3f}  Recall={rows['recall']:.3f}  F1={rows['f1']:.3f}")
          assert rows["f1"] >= 0.0, "F1 must be non-negative"
          print("PDU smoke validation PASSED")
          EOF
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-results-pdu
          path: experiments/results/
          retention-days: 30

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build simulator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.simulator
          push: false
          tags: pdu-power-guardian/simulator:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.app
          push: false
          tags: pdu-power-guardian/app:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
