# APC Smart-UPS SRT — SNMP v2c configuration + key OID map
# Reference: APC PowerNet MIB (APC-MIB) — powerNetMIB OID 1.3.6.1.4.1.318
# Replace PLACEHOLDER values via environment variables.

snmp:
  host: "${APC_SMARTUPS_HOST}"
  port: 161
  version: 2c
  community: "${APC_SMARTUPS_COMMUNITY}"   # NEVER hard-code
  timeout_s: 5
  retries: 2

oids:
  # UPS model / identity
  model_name:               "1.3.6.1.4.1.318.1.1.1.1.1.1.0"
  firmware_version:         "1.3.6.1.4.1.318.1.1.1.1.2.1.0"
  # Battery
  battery_status:           "1.3.6.1.4.1.318.1.1.1.2.1.1.0"
    # 1=unknown 2=batteryNormal 3=batteryLow 4=batteryInFaultCondition
  battery_charge_pct:       "1.3.6.1.4.1.318.1.1.1.2.2.1.0"
  battery_temp_c:           "1.3.6.1.4.1.318.1.1.1.2.2.2.0"
  battery_runtime_min:      "1.3.6.1.4.1.318.1.1.1.2.2.3.0"
  battery_voltage_v:        "1.3.6.1.4.1.318.1.1.1.2.2.8.0"
  # Input
  input_line_voltage_v:     "1.3.6.1.4.1.318.1.1.1.3.2.1.0"
  input_line_freq_hz:       "1.3.6.1.4.1.318.1.1.1.3.2.4.0"
  # Output
  output_voltage_v:         "1.3.6.1.4.1.318.1.1.1.4.2.1.0"
  output_load_pct:          "1.3.6.1.4.1.318.1.1.1.4.2.3.0"
  output_current_a:         "1.3.6.1.4.1.318.1.1.1.4.2.4.0"
  output_power_w:           "1.3.6.1.4.1.318.1.1.1.4.2.8.0"
  output_energy_wh:         "1.3.6.1.4.1.318.1.1.1.4.2.9.0"
  # Transfer
  last_transfer_reason:     "1.3.6.1.4.1.318.1.1.1.3.2.5.0"

poll_interval_s: 30

# SIMULATION MODE
simulation:
  enabled_if_host_unreachable: true
  nominal_output_w: 5000
  battery_charge_pct: 95
