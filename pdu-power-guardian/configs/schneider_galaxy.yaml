# Schneider Electric Galaxy UPS — Modbus/TCP configuration + register map
# Reference: Schneider Galaxy 3500/5500/7000 Modbus Implementation Guide
# Replace PLACEHOLDER values via environment variables.

modbus:
  host: "${SCHNEIDER_GALAXY_HOST}"
  port: "${SCHNEIDER_MODBUS_PORT:-502}"
  unit_id: "${SCHNEIDER_MODBUS_UNIT_ID:-1}"
  timeout_s: 3
  retries: 2

registers:
  # All values are 16-bit input registers (function code 4) unless noted
  # Multiply by scale_factor to get engineering units
  input_voltage_v:
    address: 0x0001
    scale_factor: 0.1
    unit: V
  input_frequency_hz:
    address: 0x0003
    scale_factor: 0.1
    unit: Hz
  output_voltage_v:
    address: 0x0010
    scale_factor: 0.1
    unit: V
  output_current_a:
    address: 0x0012
    scale_factor: 0.1
    unit: A
  output_power_kva:
    address: 0x0014
    scale_factor: 0.01
    unit: kVA
  output_power_kw:
    address: 0x0016
    scale_factor: 0.01
    unit: kW
  output_load_pct:
    address: 0x0018
    scale_factor: 1
    unit: "%"
  battery_voltage_v:
    address: 0x0020
    scale_factor: 0.1
    unit: V
  battery_charge_pct:
    address: 0x0022
    scale_factor: 1
    unit: "%"
  battery_temp_c:
    address: 0x0024
    scale_factor: 0.1
    unit: C
  bypass_voltage_v:
    address: 0x0030
    scale_factor: 0.1
    unit: V
  ups_status_word:
    address: 0x0100
    scale_factor: 1
    unit: bitmask  # bit 0=on-line, 1=on-bypass, 2=battery, 3=fault

poll_interval_s: 15

# SIMULATION MODE
simulation:
  enabled_if_host_unreachable: true
  nominal_kw: 30.0
