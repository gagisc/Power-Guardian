version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Winnipeg"
    open-pull-requests-limit: 8
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "build(deps)"
    groups:
      ml-stack:
        patterns: ["torch*", "torchvision*", "numpy*", "pandas*", "scikit-learn*"]
      dev-tools:
        dependency-type: "development"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Winnipeg"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci(deps)"
